<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
            background-color: #8b4513;
            color: white;
            padding: 20px;
        }

        .menu {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .food {
            background-color: white;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 2px 8px gray;
        }

        .food img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-radius: 8px;
        }

        .food h2 {
            margin: 10px;
        }

        .price {
            color: green;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>🍴 Our Restaurant Menu</h1>

    <div class="menu">

        <div class="food">
            <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38">
            <h2>Pizza</h2>
            <p class="price">₹150</p>
        </div>

        <div class="food">
            <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd">
            <h2>Burger</h2>
            <p class="price">₹120</p>
        </div>

        <div class="food">
            <img src="https://images.unsplash.com/photo-1573080496219-bb080dd4f877">
            <h2>French Fries</h2>
            <p class="price">₹80</p>
        </div>

        <div class="food">
            <img src="https://images.unsplash.com/photo-1473093295043-cdd812d0e601">
            <h2>Pasta</h2>
            <p class="price">₹130</p>
        </div>

        <div class="food">
            <img src="https://images.unsplash.com/photo-1541592106381-b31e9677c0e5">
            <h2>Sandwich</h2>
            <p class="price">₹100</p>
        </div>

        <div class="food">
            <img src="https://images.unsplash.com/photo-1578985545062-69928b1d9587">
            <h2>Cake</h2>
            <p class="price">₹90</p>
        </div>

    </div>

</body>
</html>
